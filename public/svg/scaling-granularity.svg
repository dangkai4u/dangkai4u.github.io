<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- Row 1 -->

  <!-- Tensor-wise -->
  <g transform="translate(15, 20)">
    <text x="95" y="0" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">Tensor-wise</text>
    <text x="95" y="16" text-anchor="middle" font-size="10" fill="#9b9a97">1 scale / tensor</text>
    <rect x="10" y="28" width="170" height="110" rx="4" fill="#f7f6f3" stroke="#e9e9e7" stroke-width="1.5"/>
    <text x="95" y="88" text-anchor="middle" font-size="14" fill="#4a90d9" font-weight="500">scale = s</text>
    <text x="95" y="158" text-anchor="middle" font-size="10" fill="#9b9a97">Precision: Low</text>
    <text x="95" y="173" text-anchor="middle" font-size="10" fill="#9b9a97">Scale: FP32</text>
    <rect x="30" y="186" width="130" height="6" rx="3" fill="#e9e9e7"/>
    <rect x="30" y="186" width="25" height="6" rx="3" fill="#e07c5a"/>
  </g>

  <!-- Block-wise -->
  <g transform="translate(360, 20)">
    <text x="95" y="0" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">Block-wise</text>
    <text x="95" y="16" text-anchor="middle" font-size="10" fill="#9b9a97">1 scale / 128×128</text>
    <rect x="10" y="28" width="170" height="110" rx="4" fill="none" stroke="#e9e9e7" stroke-width="1.5"/>
    <!-- Grid -->
    <rect x="14" y="32" width="78" height="50" rx="3" fill="#e7f3fe" stroke="#4a90d9" stroke-width="1" opacity="0.8"/>
    <text x="53" y="62" text-anchor="middle" font-size="11" fill="#4a90d9">s₁</text>
    <rect x="98" y="32" width="78" height="50" rx="3" fill="#fef3cd" stroke="#e0a800" stroke-width="1" opacity="0.8"/>
    <text x="137" y="62" text-anchor="middle" font-size="11" fill="#c49000">s₂</text>
    <rect x="14" y="86" width="78" height="48" rx="3" fill="#d4edda" stroke="#6ab04c" stroke-width="1" opacity="0.8"/>
    <text x="53" y="115" text-anchor="middle" font-size="11" fill="#5a9e42">s₃</text>
    <rect x="98" y="86" width="78" height="48" rx="3" fill="#e8deee" stroke="#9b59b6" stroke-width="1" opacity="0.8"/>
    <text x="137" y="115" text-anchor="middle" font-size="11" fill="#8e44ad">s₄</text>
    <text x="95" y="158" text-anchor="middle" font-size="10" fill="#9b9a97">Precision: Medium</text>
    <text x="95" y="173" text-anchor="middle" font-size="10" fill="#9b9a97">Scale: FP32</text>
    <rect x="30" y="186" width="130" height="6" rx="3" fill="#e9e9e7"/>
    <rect x="30" y="186" width="70" height="6" rx="3" fill="#f0c040"/>
  </g>

  <!-- Row 2 -->

  <!-- Tile-wise -->
  <g transform="translate(15, 260)">
    <text x="95" y="0" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">Tile-wise</text>
    <text x="95" y="16" text-anchor="middle" font-size="10" fill="#9b9a97">1 scale / 1×128</text>
    <rect x="10" y="28" width="170" height="110" rx="4" fill="none" stroke="#e9e9e7" stroke-width="1.5"/>
    <!-- Rows -->
    <rect x="14" y="32" width="162" height="20" rx="2" fill="#e7f3fe" stroke="#4a90d9" stroke-width="0.8"/>
    <text x="30" y="46" font-size="9" fill="#4a90d9" font-weight="500">s₁</text>
    <text x="82" y="46" font-size="9" fill="#4a90d9" font-weight="500">s₂</text>
    <text x="140" y="46" font-size="9" fill="#4a90d9" font-weight="500">s₃</text>
    <line x1="58" y1="34" x2="58" y2="50" stroke="#4a90d9" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="114" y1="34" x2="114" y2="50" stroke="#4a90d9" stroke-width="0.5" stroke-dasharray="2,2"/>

    <rect x="14" y="56" width="162" height="20" rx="2" fill="#fef3cd" stroke="#e0a800" stroke-width="0.8"/>
    <text x="30" y="70" font-size="9" fill="#c49000" font-weight="500">s₄</text>
    <text x="82" y="70" font-size="9" fill="#c49000" font-weight="500">s₅</text>
    <text x="140" y="70" font-size="9" fill="#c49000" font-weight="500">s₆</text>
    <line x1="58" y1="58" x2="58" y2="74" stroke="#e0a800" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="114" y1="58" x2="114" y2="74" stroke="#e0a800" stroke-width="0.5" stroke-dasharray="2,2"/>

    <rect x="14" y="80" width="162" height="20" rx="2" fill="#d4edda" stroke="#6ab04c" stroke-width="0.8"/>
    <text x="30" y="94" font-size="9" fill="#5a9e42" font-weight="500">s₇</text>
    <text x="82" y="94" font-size="9" fill="#5a9e42" font-weight="500">s₈</text>
    <text x="140" y="94" font-size="9" fill="#5a9e42" font-weight="500">s₉</text>
    <line x1="58" y1="82" x2="58" y2="98" stroke="#6ab04c" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="114" y1="82" x2="114" y2="98" stroke="#6ab04c" stroke-width="0.5" stroke-dasharray="2,2"/>

    <rect x="14" y="104" width="162" height="20" rx="2" fill="#e8deee" stroke="#9b59b6" stroke-width="0.8"/>
    <text x="30" y="118" font-size="9" fill="#8e44ad" font-weight="500">s₁₀</text>
    <text x="82" y="118" font-size="9" fill="#8e44ad" font-weight="500">s₁₁</text>
    <text x="140" y="118" font-size="9" fill="#8e44ad" font-weight="500">s₁₂</text>
    <line x1="58" y1="106" x2="58" y2="122" stroke="#9b59b6" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="114" y1="106" x2="114" y2="122" stroke="#9b59b6" stroke-width="0.5" stroke-dasharray="2,2"/>

    <text x="95" y="158" text-anchor="middle" font-size="10" fill="#9b9a97">Precision: High</text>
    <text x="95" y="173" text-anchor="middle" font-size="10" fill="#9b9a97">Scale: FP32</text>
    <rect x="30" y="186" width="130" height="6" rx="3" fill="#e9e9e7"/>
    <rect x="30" y="186" width="120" height="6" rx="3" fill="#6ab04c"/>
  </g>

  <!-- MXFP8 (OCP) -->
  <g transform="translate(360, 260)">
    <text x="95" y="0" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">MXFP8 (OCP)</text>
    <text x="95" y="16" text-anchor="middle" font-size="10" fill="#9b9a97">1 scale / 1×32</text>
    <rect x="10" y="28" width="170" height="110" rx="4" fill="none" stroke="#e9e9e7" stroke-width="1.5"/>
    <!-- Row-based 1×32 groups, similar to Tile-wise but finer -->
    <!-- Row 1: 5 groups across -->
    <rect x="14" y="32" width="30" height="20" rx="2" fill="#e7f3fe" stroke="#4a90d9" stroke-width="0.8"/>
    <text x="29" y="46" text-anchor="middle" font-size="7" fill="#4a90d9" font-weight="500">s₁</text>
    <rect x="47" y="32" width="30" height="20" rx="2" fill="#fef3cd" stroke="#e0a800" stroke-width="0.8"/>
    <text x="62" y="46" text-anchor="middle" font-size="7" fill="#c49000" font-weight="500">s₂</text>
    <rect x="80" y="32" width="30" height="20" rx="2" fill="#d4edda" stroke="#6ab04c" stroke-width="0.8"/>
    <text x="95" y="46" text-anchor="middle" font-size="7" fill="#5a9e42" font-weight="500">s₃</text>
    <rect x="113" y="32" width="30" height="20" rx="2" fill="#e8deee" stroke="#9b59b6" stroke-width="0.8"/>
    <text x="128" y="46" text-anchor="middle" font-size="7" fill="#8e44ad" font-weight="500">s₄</text>
    <rect x="146" y="32" width="30" height="20" rx="2" fill="#fde8e8" stroke="#e07c5a" stroke-width="0.8"/>
    <text x="161" y="46" text-anchor="middle" font-size="7" fill="#e07c5a" font-weight="500">s₅</text>
    <!-- Row 2 -->
    <rect x="14" y="56" width="30" height="20" rx="2" fill="#fde8e8" stroke="#e07c5a" stroke-width="0.8"/>
    <text x="29" y="70" text-anchor="middle" font-size="7" fill="#e07c5a" font-weight="500">s₆</text>
    <rect x="47" y="56" width="30" height="20" rx="2" fill="#e7f3fe" stroke="#4a90d9" stroke-width="0.8"/>
    <text x="62" y="70" text-anchor="middle" font-size="7" fill="#4a90d9" font-weight="500">s₇</text>
    <rect x="80" y="56" width="30" height="20" rx="2" fill="#fef3cd" stroke="#e0a800" stroke-width="0.8"/>
    <text x="95" y="70" text-anchor="middle" font-size="7" fill="#c49000" font-weight="500">s₈</text>
    <rect x="113" y="56" width="30" height="20" rx="2" fill="#d4edda" stroke="#6ab04c" stroke-width="0.8"/>
    <text x="128" y="70" text-anchor="middle" font-size="7" fill="#5a9e42" font-weight="500">s₉</text>
    <rect x="146" y="56" width="30" height="20" rx="2" fill="#e8deee" stroke="#9b59b6" stroke-width="0.8"/>
    <text x="161" y="70" text-anchor="middle" font-size="7" fill="#8e44ad" font-weight="500">s₁₀</text>
    <!-- Row 3 -->
    <rect x="14" y="80" width="30" height="20" rx="2" fill="#e8deee" stroke="#9b59b6" stroke-width="0.8"/>
    <text x="29" y="94" text-anchor="middle" font-size="7" fill="#8e44ad" font-weight="500">s₁₁</text>
    <rect x="47" y="80" width="30" height="20" rx="2" fill="#fde8e8" stroke="#e07c5a" stroke-width="0.8"/>
    <text x="62" y="94" text-anchor="middle" font-size="7" fill="#e07c5a" font-weight="500">s₁₂</text>
    <rect x="80" y="80" width="30" height="20" rx="2" fill="#e7f3fe" stroke="#4a90d9" stroke-width="0.8"/>
    <text x="95" y="94" text-anchor="middle" font-size="7" fill="#4a90d9" font-weight="500">s₁₃</text>
    <rect x="113" y="80" width="30" height="20" rx="2" fill="#fef3cd" stroke="#e0a800" stroke-width="0.8"/>
    <text x="128" y="94" text-anchor="middle" font-size="7" fill="#c49000" font-weight="500">s₁₄</text>
    <rect x="146" y="80" width="30" height="20" rx="2" fill="#d4edda" stroke="#6ab04c" stroke-width="0.8"/>
    <text x="161" y="94" text-anchor="middle" font-size="7" fill="#5a9e42" font-weight="500">s₁₅</text>
    <!-- Row 4 -->
    <rect x="14" y="104" width="30" height="20" rx="2" fill="#d4edda" stroke="#6ab04c" stroke-width="0.8"/>
    <text x="29" y="118" text-anchor="middle" font-size="7" fill="#5a9e42" font-weight="500">s₁₆</text>
    <rect x="47" y="104" width="30" height="20" rx="2" fill="#e8deee" stroke="#9b59b6" stroke-width="0.8"/>
    <text x="62" y="118" text-anchor="middle" font-size="7" fill="#8e44ad" font-weight="500">s₁₇</text>
    <rect x="80" y="104" width="30" height="20" rx="2" fill="#fde8e8" stroke="#e07c5a" stroke-width="0.8"/>
    <text x="95" y="118" text-anchor="middle" font-size="7" fill="#e07c5a" font-weight="500">s₁₈</text>
    <rect x="113" y="104" width="30" height="20" rx="2" fill="#e7f3fe" stroke="#4a90d9" stroke-width="0.8"/>
    <text x="128" y="118" text-anchor="middle" font-size="7" fill="#4a90d9" font-weight="500">s₁₉</text>
    <rect x="146" y="104" width="30" height="20" rx="2" fill="#fef3cd" stroke="#e0a800" stroke-width="0.8"/>
    <text x="161" y="118" text-anchor="middle" font-size="7" fill="#c49000" font-weight="500">s₂₀</text>
    <!-- Labels -->
    <text x="95" y="158" text-anchor="middle" font-size="10" fill="#9b9a97">Precision: Medium-High</text>
    <text x="95" y="173" text-anchor="middle" font-size="10" fill="#9b9a97">Scale: E8M0 (power-of-2)</text>
    <rect x="30" y="186" width="130" height="6" rx="3" fill="#e9e9e7"/>
    <rect x="30" y="186" width="95" height="6" rx="3" fill="#4a90d9"/>
  </g>

  <!-- Precision bars legend -->
  <text x="350" y="490" text-anchor="middle" font-size="9" fill="#9b9a97">← lower precision          precision bar          higher precision →</text>
</svg>
