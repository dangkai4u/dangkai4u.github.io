<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9b9a97"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="20" text-anchor="middle" font-size="13" fill="#9b9a97" font-weight="500">Value Distribution Comparison</text>

  <!-- FP8 Section -->
  <text x="30" y="58" font-size="13" fill="#4a90d9" font-weight="600">FP8 E4M3</text>
  <text x="30" y="73" font-size="10" fill="#9b9a97">256 values, logarithmic spacing</text>

  <!-- FP8 number line -->
  <line x1="140" y1="65" x2="650" y2="65" stroke="#e9e9e7" stroke-width="2"/>
  <line x1="140" y1="65" x2="650" y2="65" stroke="#4a90d9" stroke-width="1.5" opacity="0.3"/>

  <!-- FP8 ticks — dense near zero, sparse at edges -->
  <g stroke="#4a90d9" stroke-width="1.5">
    <!-- Dense region near zero -->
    <line x1="390" y1="55" x2="390" y2="75"/>
    <line x1="394" y1="58" x2="394" y2="72"/>
    <line x1="398" y1="58" x2="398" y2="72"/>
    <line x1="402" y1="58" x2="402" y2="72"/>
    <line x1="406" y1="58" x2="406" y2="72"/>
    <line x1="411" y1="58" x2="411" y2="72"/>
    <line x1="416" y1="58" x2="416" y2="72"/>
    <line x1="422" y1="58" x2="422" y2="72"/>
    <line x1="386" y1="58" x2="386" y2="72"/>
    <line x1="382" y1="58" x2="382" y2="72"/>
    <line x1="378" y1="58" x2="378" y2="72"/>
    <line x1="374" y1="58" x2="374" y2="72"/>
    <line x1="369" y1="58" x2="369" y2="72"/>
    <line x1="364" y1="58" x2="364" y2="72"/>
    <line x1="358" y1="58" x2="358" y2="72"/>
    <!-- Transition zone -->
    <line x1="430" y1="58" x2="430" y2="72"/>
    <line x1="440" y1="58" x2="440" y2="72"/>
    <line x1="452" y1="58" x2="452" y2="72"/>
    <line x1="467" y1="58" x2="467" y2="72"/>
    <line x1="346" y1="58" x2="346" y2="72"/>
    <line x1="332" y1="58" x2="332" y2="72"/>
    <line x1="316" y1="58" x2="316" y2="72"/>
    <!-- Sparse region -->
    <line x1="487" y1="58" x2="487" y2="72"/>
    <line x1="515" y1="58" x2="515" y2="72"/>
    <line x1="555" y1="58" x2="555" y2="72"/>
    <line x1="610" y1="58" x2="610" y2="72"/>
    <line x1="295" y1="58" x2="295" y2="72"/>
    <line x1="268" y1="58" x2="268" y2="72"/>
    <line x1="230" y1="58" x2="230" y2="72"/>
    <line x1="180" y1="58" x2="180" y2="72"/>
  </g>

  <!-- FP8 labels -->
  <text x="390" y="90" text-anchor="middle" font-size="10" fill="#37352f">0</text>
  <text x="610" y="90" text-anchor="middle" font-size="10" fill="#37352f">448</text>
  <text x="180" y="90" text-anchor="middle" font-size="10" fill="#37352f">-448</text>

  <!-- FP8 annotations -->
  <text x="390" y="105" text-anchor="middle" font-size="9" fill="#4a90d9">dense near zero</text>
  <path d="M 500,52 C 530,42 570,42 600,52" stroke="#9b9a97" stroke-width="0.8" fill="none" stroke-dasharray="3,2"/>
  <text x="550" y="46" text-anchor="middle" font-size="9" fill="#9b9a97">sparse at tails</text>

  <!-- INT8 Section -->
  <text x="30" y="150" font-size="13" fill="#6ab04c" font-weight="600">INT8</text>
  <text x="30" y="165" font-size="10" fill="#9b9a97">256 values, uniform spacing</text>

  <!-- INT8 number line -->
  <line x1="140" y1="157" x2="650" y2="157" stroke="#e9e9e7" stroke-width="2"/>
  <line x1="140" y1="157" x2="650" y2="157" stroke="#6ab04c" stroke-width="1.5" opacity="0.3"/>

  <!-- INT8 ticks — uniform spacing -->
  <g stroke="#6ab04c" stroke-width="1.5">
    <line x1="160" y1="150" x2="160" y2="164"/>
    <line x1="180" y1="150" x2="180" y2="164"/>
    <line x1="200" y1="150" x2="200" y2="164"/>
    <line x1="220" y1="150" x2="220" y2="164"/>
    <line x1="240" y1="150" x2="240" y2="164"/>
    <line x1="260" y1="150" x2="260" y2="164"/>
    <line x1="280" y1="150" x2="280" y2="164"/>
    <line x1="300" y1="150" x2="300" y2="164"/>
    <line x1="320" y1="150" x2="320" y2="164"/>
    <line x1="340" y1="150" x2="340" y2="164"/>
    <line x1="360" y1="150" x2="360" y2="164"/>
    <line x1="380" y1="150" x2="380" y2="164"/>
    <line x1="400" y1="150" x2="400" y2="164"/>
    <line x1="420" y1="150" x2="420" y2="164"/>
    <line x1="440" y1="150" x2="440" y2="164"/>
    <line x1="460" y1="150" x2="460" y2="164"/>
    <line x1="480" y1="150" x2="480" y2="164"/>
    <line x1="500" y1="150" x2="500" y2="164"/>
    <line x1="520" y1="150" x2="520" y2="164"/>
    <line x1="540" y1="150" x2="540" y2="164"/>
    <line x1="560" y1="150" x2="560" y2="164"/>
    <line x1="580" y1="150" x2="580" y2="164"/>
    <line x1="600" y1="150" x2="600" y2="164"/>
    <line x1="620" y1="150" x2="620" y2="164"/>
    <line x1="640" y1="150" x2="640" y2="164"/>
  </g>

  <!-- INT8 labels -->
  <text x="160" y="182" text-anchor="middle" font-size="10" fill="#37352f">-128</text>
  <text x="400" y="182" text-anchor="middle" font-size="10" fill="#37352f">0</text>
  <text x="640" y="182" text-anchor="middle" font-size="10" fill="#37352f">127</text>

  <!-- INT8 annotation -->
  <text x="400" y="200" text-anchor="middle" font-size="9" fill="#6ab04c">uniform spacing everywhere</text>
</svg>
