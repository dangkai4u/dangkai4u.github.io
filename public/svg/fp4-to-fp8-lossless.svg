<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- Panel 1: FP4 ⊂ FP8 number line -->
  <text x="340" y="18" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">Step 1: FP4 values are exact FP8 grid points</text>
  <text x="340" y="34" text-anchor="middle" font-size="10" fill="#9b9a97">FP8 E4M3 (4+3 bits) strictly contains FP4 E2M1 (2+1 bits) — no rounding needed</text>

  <!-- Number line 0 to 7 -->
  <line x1="60" y1="80" x2="640" y2="80" stroke="#e9e9e7" stroke-width="2"/>

  <!-- FP8 ticks (small gray, showing density) -->
  <g stroke="#ccc" stroke-width="1">
    <!-- [0.25, 1): dense, ~0.0625 spacing -->
    <line x1="81" y1="74" x2="81" y2="86"/>
    <line x1="91" y1="74" x2="91" y2="86"/>
    <line x1="107" y1="74" x2="107" y2="86"/>
    <line x1="112" y1="74" x2="112" y2="86"/>
    <line x1="117" y1="74" x2="117" y2="86"/>
    <line x1="122" y1="74" x2="122" y2="86"/>
    <line x1="127" y1="74" x2="127" y2="86"/>
    <line x1="133" y1="74" x2="133" y2="86"/>
    <line x1="138" y1="74" x2="138" y2="86"/>
    <!-- [1, 2): 0.125 spacing -->
    <line x1="153" y1="74" x2="153" y2="86"/>
    <line x1="164" y1="74" x2="164" y2="86"/>
    <line x1="174" y1="74" x2="174" y2="86"/>
    <line x1="195" y1="74" x2="195" y2="86"/>
    <line x1="205" y1="74" x2="205" y2="86"/>
    <line x1="216" y1="74" x2="216" y2="86"/>
    <!-- [2, 4): 0.25 spacing -->
    <line x1="247" y1="74" x2="247" y2="86"/>
    <line x1="268" y1="74" x2="268" y2="86"/>
    <line x1="288" y1="74" x2="288" y2="86"/>
    <line x1="330" y1="74" x2="330" y2="86"/>
    <line x1="350" y1="74" x2="350" y2="86"/>
    <line x1="371" y1="74" x2="371" y2="86"/>
    <!-- [4, 7]: 0.5 spacing -->
    <line x1="433" y1="74" x2="433" y2="86"/>
    <line x1="474" y1="74" x2="474" y2="86"/>
    <line x1="516" y1="74" x2="516" y2="86"/>
    <line x1="599" y1="74" x2="599" y2="86"/>
    <line x1="640" y1="74" x2="640" y2="86"/>
  </g>

  <!-- FP4 ticks (larger, colored, with value labels) -->
  <g stroke="#4a90d9" stroke-width="2.5">
    <line x1="60" y1="68" x2="60" y2="92"/>
    <line x1="101" y1="68" x2="101" y2="92"/>
    <line x1="143" y1="68" x2="143" y2="92"/>
    <line x1="184" y1="68" x2="184" y2="92"/>
    <line x1="226" y1="68" x2="226" y2="92"/>
    <line x1="309" y1="68" x2="309" y2="92"/>
    <line x1="391" y1="68" x2="391" y2="92"/>
    <line x1="557" y1="68" x2="557" y2="92"/>
  </g>

  <!-- FP4 dots -->
  <g fill="#4a90d9">
    <circle cx="60" cy="80" r="4"/>
    <circle cx="101" cy="80" r="4"/>
    <circle cx="143" cy="80" r="4"/>
    <circle cx="184" cy="80" r="4"/>
    <circle cx="226" cy="80" r="4"/>
    <circle cx="309" cy="80" r="4"/>
    <circle cx="391" cy="80" r="4"/>
    <circle cx="557" cy="80" r="4"/>
  </g>

  <!-- FP4 value labels -->
  <g font-size="10" fill="#4a90d9" text-anchor="middle" font-weight="500">
    <text x="60" y="108">0</text>
    <text x="101" y="108">0.5</text>
    <text x="143" y="108">1</text>
    <text x="184" y="108">1.5</text>
    <text x="226" y="108">2</text>
    <text x="309" y="108">3</text>
    <text x="391" y="108">4</text>
    <text x="557" y="108">6</text>
  </g>

  <!-- Legend -->
  <line x1="60" y1="125" x2="72" y2="125" stroke="#ccc" stroke-width="1"/>
  <text x="76" y="128" font-size="9" fill="#9b9a97">FP8 grid (256 values)</text>
  <circle cx="160" cy="125" r="3.5" fill="#4a90d9"/>
  <text x="168" y="128" font-size="9" fill="#4a90d9">FP4 values (16 values) — all on FP8 grid</text>

  <!-- Divider -->
  <line x1="60" y1="145" x2="640" y2="145" stroke="#e9e9e7" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Panel 2: Scale multiplication example -->
  <text x="340" y="168" text-anchor="middle" font-size="12" fill="#37352f" font-weight="600">Step 2: ×2ⁿ (E8M0 scale) only shifts exponent</text>
  <text x="340" y="184" text-anchor="middle" font-size="10" fill="#9b9a97">Power-of-2 multiplication = exponent add, mantissa untouched → exact</text>

  <!-- Example: 1.5 × 2² = 6.0 -->

  <!-- FP8 value 1.5 -->
  <g transform="translate(70, 205)">
    <text x="0" y="0" font-size="11" fill="#37352f" font-weight="500">1.5 (FP8)</text>
    <!-- Bit fields -->
    <rect x="0" y="10" width="24" height="24" rx="3" fill="#f7f6f3" stroke="#d0d0d0" stroke-width="1"/>
    <text x="12" y="27" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="28" y="10" width="96" height="24" rx="3" fill="#e7f3fe" stroke="#4a90d9" stroke-width="1"/>
    <text x="76" y="27" text-anchor="middle" font-size="11" fill="#4a90d9" font-weight="500">0 1 1 1</text>
    <rect x="128" y="10" width="72" height="24" rx="3" fill="#d4edda" stroke="#6ab04c" stroke-width="1"/>
    <text x="164" y="27" text-anchor="middle" font-size="11" fill="#5a9e42" font-weight="500">1 0 0</text>
    <!-- Labels -->
    <text x="12" y="50" text-anchor="middle" font-size="8" fill="#9b9a97">S</text>
    <text x="76" y="50" text-anchor="middle" font-size="8" fill="#4a90d9">Exponent</text>
    <text x="164" y="50" text-anchor="middle" font-size="8" fill="#5a9e42">Mantissa</text>
  </g>

  <!-- Arrow: ×2² -->
  <g transform="translate(290, 215)">
    <line x1="0" y1="12" x2="80" y2="12" stroke="#37352f" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="40" y="6" text-anchor="middle" font-size="11" fill="#37352f" font-weight="600">×2²</text>
    <text x="40" y="38" text-anchor="middle" font-size="9" fill="#9b9a97">E8M0 scale</text>
  </g>

  <!-- FP8 value 6.0 -->
  <g transform="translate(390, 205)">
    <text x="0" y="0" font-size="11" fill="#37352f" font-weight="500">6.0 (FP8)</text>
    <!-- Bit fields -->
    <rect x="0" y="10" width="24" height="24" rx="3" fill="#f7f6f3" stroke="#d0d0d0" stroke-width="1"/>
    <text x="12" y="27" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="28" y="10" width="96" height="24" rx="3" fill="#fef3cd" stroke="#e0a800" stroke-width="1.5"/>
    <text x="76" y="27" text-anchor="middle" font-size="11" fill="#c49000" font-weight="600">1 0 0 1</text>
    <rect x="128" y="10" width="72" height="24" rx="3" fill="#d4edda" stroke="#6ab04c" stroke-width="1"/>
    <text x="164" y="27" text-anchor="middle" font-size="11" fill="#5a9e42" font-weight="500">1 0 0</text>
    <!-- Labels -->
    <text x="12" y="50" text-anchor="middle" font-size="8" fill="#9b9a97">S</text>
    <text x="76" y="50" text-anchor="middle" font-size="8" fill="#c49000">Exp +2</text>
    <text x="164" y="50" text-anchor="middle" font-size="8" fill="#5a9e42">unchanged</text>
  </g>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#37352f"/>
    </marker>
  </defs>

  <!-- Bottom annotation -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="580" height="40" rx="6" fill="#f7f6f3" stroke="#e9e9e7" stroke-width="1"/>
    <text x="290" y="16" text-anchor="middle" font-size="10" fill="#37352f" font-weight="500">Both steps are exact → FP4 × scale → FP8 is strictly lossless</text>
    <text x="290" y="32" text-anchor="middle" font-size="9" fill="#9b9a97">QAT can directly reuse the FP8 training framework without modifying backward pass</text>
  </g>

</svg>
